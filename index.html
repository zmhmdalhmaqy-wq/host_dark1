<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DARK BRO HOST | لوحة التحكم الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0c12;
            color: #eef5ff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #0f0f1f, #05070c);
            z-index: -2;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .glow-orb {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            z-index: -1;
            animation: floatGlow 20s infinite ease-in-out;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(50px, -30px) scale(1.1); opacity: 0.6; }
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 12, 20, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .btn-logout {
            background: rgba(255, 68, 68, 0.15);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff8888;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-logout:hover {
            background: rgba(255, 68, 68, 0.3);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 90px 25px 40px;
            position: relative;
            z-index: 5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(15, 20, 35, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 24px;
            padding: 20px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            transform: translateY(-5px);
        }

        .stat-icon { font-size: 28px; margin-bottom: 12px; color: #00d4ff; }
        .stat-value { font-size: 32px; font-weight: 800; color: #fff; }
        .stat-label { font-size: 12px; color: #8899aa; margin-top: 6px; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i { color: #00d4ff; }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border: none;
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
        }

        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
        }

        .server-card {
            background: rgba(12, 16, 28, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 24px;
            padding: 22px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .server-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            transform: translateY(-5px);
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 102, 255, 0.1));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .server-status-badge {
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .server-status-badge.online { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
        .server-status-badge.offline { background: rgba(255, 68, 68, 0.15); color: #ff8888; }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.online { background: #00ff88; animation: pulse 1.5s infinite; }
        .status-dot.offline { background: #ff4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .server-name { font-size: 18px; font-weight: 700; margin: 12px 0 6px; }
        
        .server-details {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            font-size: 12px;
            color: #8899aa;
        }

        .server-details span { display: flex; align-items: center; gap: 5px; }

        .server-detail { display: none; animation: fadeInUp 0.4s ease; }
        .server-detail.active { display: block; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .back-btn {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateX(-3px);
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.15);
            color: #8899aa;
            padding: 10px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: #fff;
            border-color: transparent;
        }

        .console-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            height: 380px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #88ffaa;
            white-space: pre-wrap;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .info-card {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
        }

        .info-label { font-size: 11px; color: #8899aa; margin-bottom: 8px; }
        .info-value { font-size: 20px; font-weight: 700; color: #00d4ff; }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .btn-action {
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-start { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.2); }
        .btn-stop { background: rgba(255, 68, 68, 0.15); color: #ff8888; border: 1px solid rgba(255,68,68,0.2); }
        .btn-restart { background: rgba(255, 165, 0, 0.15); color: #ffaa44; border: 1px solid rgba(255,165,0,0.2); }
        .btn-delete { background: rgba(255, 68, 68, 0.2); color: #ff6666; border: 1px solid #ff4444; }

        .btn-action:hover { transform: translateY(-2px); }

        .upload-zone {
            border: 2px dashed rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 25px;
        }

        .upload-zone:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.03);
        }

        .files-table {
            width: 100%;
            border-collapse: collapse;
        }

        .files-table th {
            background: rgba(0, 212, 255, 0.08);
            padding: 14px;
            text-align: right;
            font-weight: 600;
            font-size: 12px;
            color: #00d4ff;
        }

        .files-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.08);
            font-size: 13px;
        }

        .file-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00d4ff;
        }

        .bulk-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: all 0.2s;
        }

        .btn-danger-small { background: rgba(255, 68, 68, 0.15); color: #ff8888; border: 1px solid #ff4444; }
        .btn-success-small { background: rgba(0, 255, 136, 0.15); color: #88ff88; border: 1px solid #00ff88; }
        .btn-info-small { background: rgba(0, 212, 255, 0.15); color: #88ddff; border: 1px solid #00d4ff; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active { display: flex; animation: fadeIn 0.2s ease; }

        .modal-box {
            background: rgba(15, 20, 35, 0.98);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 28px;
            padding: 30px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow: auto;
        }

        .modal textarea {
            width: 100%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 16px;
            color: #fff;
            padding: 15px;
            font-family: monospace;
            font-size: 13px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 12, 20, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid #00d4ff;
            color: #fff;
            padding: 12px 28px;
            border-radius: 50px;
            z-index: 9999;
            display: none;
            font-size: 13px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { bottom: -60px; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }

        .toast.success { border-color: #00ff88; color: #88ff88; }
        .toast.error { border-color: #ff4444; color: #ff8888; }

        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .info-grid { grid-template-columns: repeat(2, 1fr); }
            .action-buttons { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 640px) {
            .container { padding: 80px 15px 30px; }
            .stats-grid { grid-template-columns: 1fr; }
            .servers-grid { grid-template-columns: 1fr; }
            .topbar { padding: 10px 15px; }
            .logo-text { font-size: 16px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 212, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.3); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grid-overlay"></div>
    <div class="glow-orb"></div>

    <div class="topbar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-skull"></i></div>
            <span class="logo-text">DARK BRO HOST</span>
        </div>
        <div class="topbar-right">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">D</div>
                <span>مرحباً، <strong id="username">User</strong></span>
            </div>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
    </div>

    <div class="container">
        <div id="homeView">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-server"></i></div>
                    <div class="stat-value" id="srvUsed">0/0</div>
                    <div class="stat-label">السيرفرات المستخدمة</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-calendar-alt"></i></div>
                    <div class="stat-value" id="accExpiry">30</div>
                    <div class="stat-label">الأيام المتبقية</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-microchip"></i></div>
                    <div class="stat-value" id="sysCpu">0%</div>
                    <div class="stat-label">المعالج</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-memory"></i></div>
                    <div class="stat-value" id="sysRam">0%</div>
                    <div class="stat-label">الرام</div>
                </div>
            </div>

            <div class="section-header">
                <div class="section-title"><i class="fas fa-crown"></i> سيرفراتي</div>
                <button class="btn-primary" onclick="createNewServer()"><i class="fas fa-plus"></i> إنشاء سيرفر</button>
            </div>

            <div class="servers-grid" id="serversGrid">
                <div style="color:#8899aa; text-align:center; padding:80px;"><i class="fas fa-spinner fa-pulse"></i> جاري التحميل...</div>
            </div>
        </div>

        <div id="serverDetailView" class="server-detail">
            <div class="detail-header">
                <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-right"></i> العودة</button>
                <div class="section-title" id="serverTitle"></div>
                <div></div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('console')"><i class="fas fa-terminal"></i> الكونسول</button>
                <button class="tab-btn" onclick="switchTab('files')"><i class="fas fa-folder"></i> الملفات</button>
            </div>

            <div id="consoleTab">
                <div class="console-box" id="consoleOutput">🟢 جاهز...</div>
                <div class="info-grid">
                    <div class="info-card"><div class="info-label">الحالة</div><div class="info-value" id="statusValue">—</div></div>
                    <div class="info-card"><div class="info-label">الذاكرة</div><div class="info-value" id="memValue">0 MB</div></div>
                    <div class="info-card"><div class="info-label">مدة التشغيل</div><div class="info-value" id="uptimeValue">—</div></div>
                    <div class="info-card"><div class="info-label">المنفذ</div><div class="info-value" id="portValue">—</div></div>
                </div>
                <div class="action-buttons">
                    <button class="btn-action btn-start" onclick="serverAction('start')"><i class="fas fa-play"></i> تشغيل</button>
                    <button class="btn-action btn-restart" onclick="serverAction('restart')"><i class="fas fa-sync-alt"></i> إعادة تشغيل</button>
                    <button class="btn-action btn-stop" onclick="serverAction('stop')"><i class="fas fa-stop"></i> إيقاف</button>
                    <button class="btn-action btn-delete" onclick="confirmDeleteServer()"><i class="fas fa-trash"></i> حذف</button>
                </div>
            </div>

            <div id="filesTab" style="display: none;">
                <div class="upload-zone" onclick="document.getElementById('fileInput').click()" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 42px; margin-bottom: 12px; display: block; color: #00d4ff;"></i>
                    <div>اسحب الملفات هنا أو انقر للرفع</div>
                    <input type="file" id="fileInput" multiple style="display: none;" onchange="uploadFiles(this.files)">
                </div>

                <div class="bulk-actions">
                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)" class="file-checkbox">
                    <span style="font-size:13px;">تحديد الكل</span>
                    <button class="btn-small btn-danger-small" onclick="deleteSelectedFiles()"><i class="fas fa-trash"></i> حذف المحدد</button>
                    <button class="btn-small btn-info-small" onclick="showCreateFileModal()"><i class="fas fa-plus"></i> ملف جديد</button>
                </div>

                <div style="overflow-x: auto;">
                    <table class="files-table">
                        <thead>
                            <tr><th style="width:40px;"></th><th>اسم الملف</th><th>الحجم</th><th>الإجراءات</th> </tr>
                        </thead>
                        <tbody id="filesList">
                            <tr><td colspan="4" style="text-align:center; padding:50px;"><i class="fas fa-spinner fa-pulse"></i> جاري التحميل...</td> </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="editorModal">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div style="font-size: 18px; font-weight: 700; color: #00d4ff;"><i class="fas fa-code"></i> <span id="editorFilename"></span></div>
                <button class="back-btn" onclick="closeEditor()" style="padding: 6px 16px;"><i class="fas fa-times"></i></button>
            </div>
            <textarea id="codeArea" rows="15"></textarea>
            <div style="margin-top: 20px; display: flex; gap: 12px; justify-content: flex-end;">
                <button class="btn-primary" onclick="saveCurrentFile()"><i class="fas fa-save"></i> حفظ</button>
            </div>
        </div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-box" style="max-width: 400px; text-align: center;">
            <div style="margin-bottom: 20px;"><i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ffaa44;"></i></div>
            <div id="confirmMsg" style="margin: 15px 0; color: #8899aa;">هل أنت متأكد؟</div>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button class="btn-primary" id="confirmYesBtn" onclick="executeConfirm()" style="background: #ff4444;">تأكيد</button>
                <button class="back-btn" onclick="closeConfirm()">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="modal" id="createFileModal">
        <div class="modal-box" style="max-width: 450px;">
            <div style="margin-bottom: 20px;"><div style="font-size: 18px; font-weight: 700; color: #00d4ff;"><i class="fas fa-plus"></i> ملف جديد</div></div>
            <input type="text" id="newFileName" placeholder="اسم الملف (مثال: main.py)" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid rgba(0,212,255,0.2); border-radius:12px; color:#fff; margin-bottom:15px;">
            <textarea id="newFileContent" rows="6" placeholder="محتوى الملف (اختياري)"></textarea>
            <div style="margin-top: 20px; display: flex; gap: 12px; justify-content: flex-end;">
                <button class="btn-primary" onclick="createNewFile()">إنشاء</button>
                <button class="back-btn" onclick="closeCreateFileModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let currentServer = null;
        let pollInterval = null;
        let currentEditingFile = null;
        let confirmCallback = null;

        function showToast(msg, type = 'info', duration = 3500) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${msg}`;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.style.display = 'none', duration);
        }

        function showConfirm(msg, callback) {
            document.getElementById('confirmMsg').textContent = msg;
            confirmCallback = callback;
            document.getElementById('confirmModal').classList.add('active');
        }

        function executeConfirm() {
            closeConfirm();
            if (confirmCallback) confirmCallback();
        }

        function closeConfirm() {
            document.getElementById('confirmModal').classList.remove('active');
            confirmCallback = null;
        }

        async function checkAuth() {
            try {
                const res = await fetch('/api/current_user');
                const data = await res.json();
                if (!data.success) {
                    window.location.replace('/login');
                    return;
                }
                document.getElementById('username').textContent = data.username;
                document.getElementById('userAvatar').textContent = data.username.charAt(0).toUpperCase();
                loadServers();
                startMetrics();
            } catch(e) {
                window.location.replace('/login');
            }
        }

        async function startMetrics() {
            setInterval(async () => {
                try {
                    const res = await fetch('/api/system/metrics');
                    const data = await res.json();
                    document.getElementById('sysCpu').textContent = `${data.cpu}%`;
                    document.getElementById('sysRam').textContent = `${data.memory}%`;
                } catch(e) {}
            }, 5000);
        }

        async function loadServers() {
            const res = await fetch('/api/servers');
            const data = await res.json();
            if (!data.success) return;

            document.getElementById('srvUsed').textContent = `${data.stats.used}/${data.stats.total}`;
            document.getElementById('accExpiry').textContent = data.stats.expiry;

            const grid = document.getElementById('serversGrid');
            if (data.servers.length === 0) {
                grid.innerHTML = '<div style="color:#8899aa; text-align:center; padding:80px;"><i class="fas fa-folder-open" style="font-size:48px; margin-bottom:15px; display:block;"></i>لا توجد سيرفرات. أنشئ سيرفراً جديداً!</div>';
                return;
            }

            grid.innerHTML = '';
            data.servers.forEach(srv => {
                const isOnline = srv.status === 'Running';
                const card = document.createElement('div');
                card.className = 'server-card';
                card.innerHTML = `
                    <div class="server-header">
                        <div class="server-icon"><i class="fas fa-terminal"></i></div>
                        <div class="server-status-badge ${isOnline ? 'online' : 'offline'}">
                            <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                            ${isOnline ? 'يعمل' : 'متوقف'}
                        </div>
                    </div>
                    <div class="server-name">${escapeHtml(srv.title)}</div>
                    <div class="server-details">
                        <span><i class="fas fa-code"></i> ${escapeHtml(srv.subtitle)}</span>
                        <span><i class="fas fa-plug"></i> ${srv.port || 'N/A'}</span>
                    </div>
                `;
                card.onclick = () => openServer(srv);
                grid.appendChild(card);
            });
        }

        function openServer(srv) {
            currentServer = srv;
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('serverDetailView').classList.add('active');
            document.getElementById('serverTitle').innerHTML = `<i class="fas fa-server"></i> ${escapeHtml(srv.title)}`;
            switchTab('console');
            startPolling();
        }

        function goHome() {
            document.getElementById('homeView').style.display = 'block';
            document.getElementById('serverDetailView').classList.remove('active');
            if (pollInterval) clearInterval(pollInterval);
            loadServers();
        }

        function switchTab(tab) {
            document.getElementById('consoleTab').style.display = tab === 'console' ? 'block' : 'none';
            document.getElementById('filesTab').style.display = tab === 'files' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', (i === 0 && tab === 'console') || (i === 1 && tab === 'files'));
            });
            if (tab === 'files') loadFiles();
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            fetchStats();
            pollInterval = setInterval(fetchStats, 3000);
        }

        async function fetchStats() {
            if (!currentServer) return;
            try {
                const res = await fetch(`/api/server/stats/${currentServer.folder}`);
                const data = await res.json();
                if (!data.success) return;

                const consoleBox = document.getElementById('consoleOutput');
                consoleBox.textContent = data.logs || '🟢 جاهز...';
                consoleBox.scrollTop = consoleBox.scrollHeight;

                document.getElementById('statusValue').innerHTML = data.status === 'Running' ? '<span style="color:#00ff88;"><i class="fas fa-circle" style="font-size:10px;"></i> يعمل</span>' : '<span style="color:#ff8888;"><i class="fas fa-circle" style="font-size:10px;"></i> متوقف</span>';
                document.getElementById('memValue').textContent = data.mem || '0 MB';
                document.getElementById('uptimeValue').textContent = data.uptime || '—';
                document.getElementById('portValue').textContent = data.port || '—';
            } catch(e) {}
        }

        async function serverAction(action) {
            if (action === 'delete') { confirmDeleteServer(); return; }
            
            showToast(`⏳ جاري ${action === 'start' ? 'التشغيل' : action === 'stop' ? 'الإيقاف' : 'إعادة التشغيل'}...`, 'info');
            
            const res = await fetch(`/api/server/action/${currentServer.folder}/${action}`, { method: 'POST' });
            const data = await res.json();
            
            if (data.success) {
                showToast(data.message, 'success');
                setTimeout(() => fetchStats(), 1000);
                if (action === 'stop' || action === 'restart') {
                    setTimeout(() => loadServers(), 1500);
                }
            } else {
                showToast('❌ ' + (data.message || 'حدث خطأ'), 'error');
            }
        }

        function confirmDeleteServer() {
            showConfirm('⚠️ هل أنت متأكد من حذف السيرفر نهائياً؟ لا يمكن التراجع!', async () => {
                showToast('⏳ جاري الحذف...', 'info');
                try {
                    const res = await fetch(`/api/server/action/${currentServer.folder}/delete`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        showToast('🗑️ تم حذف السيرفر بنجاح', 'success');
                        if (pollInterval) clearInterval(pollInterval);
                        currentServer = null;
                        setTimeout(() => {
                            goHome();
                            loadServers();
                        }, 800);
                    } else {
                        showToast('❌ ' + (data.message || 'فشل الحذف'), 'error');
                    }
                } catch(e) {
                    showToast('❌ خطأ في الاتصال: ' + e.message, 'error');
                }
            });
        }

        async function loadFiles() {
            const tbody = document.getElementById('filesList');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;"><i class="fas fa-spinner fa-pulse"></i> جاري التحميل...</td></tr>';
            
            try {
                const res = await fetch(`/api/files/list/${currentServer.folder}`);
                const files = await res.json();
                
                if (!files || files.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px; color:#8899aa;"><i class="fas fa-folder-open"></i> لا توجد ملفات</td></tr>';
                    return;
                }
                
                tbody.innerHTML = files.map(f => `
                    <tr>
                        <td><input type="checkbox" class="file-checkbox select-file" value="${escapeHtml(f.name)}"></td>
                        <td><i class="fas ${f.is_dir ? 'fa-folder' : 'fa-file-code'}"></i> ${escapeHtml(f.name)}</td>
                        <td style="color:#8899aa; font-size:12px;">${f.size}</td>
                        <td>
                            ${!f.is_dir ? `<button class="back-btn" style="padding:4px 12px; margin-left:8px;" onclick="viewFile('${escapeHtml(f.name)}')"><i class="fas fa-edit"></i> تعديل</button>` : ''}
                            <button class="back-btn" style="padding:4px 12px; background:rgba(255,68,68,0.1);" onclick="deleteFile('${escapeHtml(f.name)}')"><i class="fas fa-trash"></i> حذف</button>
                        </td>
                    </tr>
                `).join('');
                document.getElementById('selectAll').checked = false;
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ff8888;">❌ فشل تحميل الملفات</td></tr>';
            }
        }

        async function deleteFile(filename) {
            showConfirm(`🗑️ هل تريد حذف "${filename}" نهائياً؟`, async () => {
                showToast('⏳ جاري الحذف...', 'info');
                try {
                    const res = await fetch(`/api/files/delete/${currentServer.folder}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ names: [filename] })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast(data.message, 'success');
                        loadFiles();
                    } else {
                        showToast('❌ ' + (data.message || 'فشل الحذف'), 'error');
                    }
                } catch(e) {
                    showToast('❌ خطأ في الاتصال', 'error');
                }
            });
        }

        async function deleteSelectedFiles() {
            const selected = Array.from(document.querySelectorAll('.select-file:checked')).map(cb => cb.value);
            
            if (selected.length === 0) {
                showToast('⚠️ الرجاء تحديد ملفات أولاً', 'warning');
                return;
            }
            
            showConfirm(`🗑️ هل تريد حذف ${selected.length} ملف نهائياً؟`, async () => {
                showToast('⏳ جاري الحذف...', 'info');
                try {
                    const res = await fetch(`/api/files/delete/${currentServer.folder}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ names: selected })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast(data.message, 'success');
                        loadFiles();
                        document.getElementById('selectAll').checked = false;
                    } else {
                        showToast('❌ ' + (data.message || 'فشل الحذف'), 'error');
                    }
                } catch(e) {
                    showToast('❌ خطأ في الاتصال', 'error');
                }
            });
        }

        function toggleSelectAll(checked) {
            document.querySelectorAll('.select-file').forEach(cb => cb.checked = checked);
        }

        async function uploadFiles(files) {
            if (!files || files.length === 0) return;
            showToast(`📤 جاري رفع ${files.length} ملف...`, 'info');
            
            const fd = new FormData();
            for (let f of files) fd.append('files[]', f);
            
            try {
                const res = await fetch(`/api/files/upload/${currentServer.folder}`, { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadFiles();
                } else {
                    showToast('❌ ' + (data.message || 'فشل الرفع'), 'error');
                }
            } catch(e) {
                showToast('❌ خطأ في الرفع', 'error');
            }
            document.getElementById('fileInput').value = '';
        }

        function handleDrop(e) {
            e.preventDefault();
            uploadFiles(e.dataTransfer.files);
        }

        async function viewFile(filename) {
            currentEditingFile = filename;
            document.getElementById('editorFilename').textContent = filename;
            document.getElementById('codeArea').value = 'جاري التحميل...';
            document.getElementById('editorModal').classList.add('active');
            
            const res = await fetch(`/api/files/content/${currentServer.folder}/${filename}`);
            const data = await res.json();
            document.getElementById('codeArea').value = data.content || '';
        }

        async function saveCurrentFile() {
            if (!currentEditingFile) return;
            const content = document.getElementById('codeArea').value;
            
            const res = await fetch(`/api/files/save/${currentServer.folder}/${currentEditingFile}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content })
            });
            const data = await res.json();
            showToast(data.message || (data.success ? '✅ تم الحفظ' : '❌ فشل الحفظ'), data.success ? 'success' : 'error');
        }

        function closeEditor() {
            document.getElementById('editorModal').classList.remove('active');
        }

        function showCreateFileModal() {
            document.getElementById('newFileName').value = '';
            document.getElementById('newFileContent').value = '';
            document.getElementById('createFileModal').classList.add('active');
        }

        function closeCreateFileModal() {
            document.getElementById('createFileModal').classList.remove('active');
        }

        async function createNewFile() {
            const filename = document.getElementById('newFileName').value.trim();
            const content = document.getElementById('newFileContent').value;
            
            if (!filename) {
                showToast('⚠️ أدخل اسم الملف', 'warning');
                return;
            }
            
            const res = await fetch(`/api/files/create/${currentServer.folder}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ filename, content })
            });
            const data = await res.json();
            
            if (data.success) {
                showToast(data.message, 'success');
                closeCreateFileModal();
                loadFiles();
            } else {
                showToast('❌ ' + (data.message || 'فشل الإنشاء'), 'error');
            }
        }

        async function createNewServer() {
            const name = prompt('أدخل اسم السيرفر الجديد:');
            if (!name || !name.trim()) return;
            
            showToast('⏳ جاري إنشاء السيرفر...', 'info');
            const res = await fetch('/api/server/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: name.trim() })
            });
            const data = await res.json();
            
            if (data.success) {
                showToast(data.message, 'success');
                loadServers();
            } else {
                showToast('❌ ' + (data.message || 'فشل الإنشاء'), 'error');
            }
        }

        async function logout() {
            showConfirm('⚠️ هل تريد تسجيل الخروج؟', async () => {
                showToast('⏳ جاري تسجيل الخروج...', 'info');
                try {
                    const res = await fetch('/api/logout', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        showToast('✅ تم تسجيل الخروج', 'success');
                        setTimeout(() => {
                            window.location.href = '/login';
                            window.location.replace('/login');
                        }, 800);
                    } else {
                        showToast('❌ ' + (data.message || 'فشل تسجيل الخروج'), 'error');
                    }
                } catch(e) {
                    showToast('❌ خطأ في الاتصال', 'error');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1000);
                }
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                if (document.getElementById('editorModal').classList.contains('active')) {
                    e.preventDefault();
                    saveCurrentFile();
                }
            }
            if (e.key === 'Escape') {
                closeEditor();
                closeConfirm();
                closeCreateFileModal();
            }
        });

        checkAuth();
    </script>
</body>
</html>
