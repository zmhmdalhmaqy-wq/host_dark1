<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>لوحة التحكم | DARK PRO HOST</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* خلفية متحركة بسيطة */
        .bg-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(30, 30, 50, 0.4) 0%, #0a0a0f 80%);
            pointer-events: none;
            z-index: -2;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(80, 80, 120, 0.08) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(80, 80, 120, 0.08) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: -1;
        }

        /* الشريط العلوي */
        .navbar {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .logo-text {
            background: linear-gradient(135deg, #f0f0ff, #a0a0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-greeting {
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .user-greeting strong {
            color: #c084fc;
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: #ef4444;
            transform: translateY(-1px);
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        /* بطاقات الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(18, 18, 24, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px 18px;
            transition: all 0.2s;
        }

        .stat-card:hover {
            border-color: rgba(139, 92, 246, 0.3);
            background: rgba(20, 20, 28, 0.8);
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            background: rgba(139, 92, 246, 0.12);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #a78bfa;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #9ca3af;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        /* قسم السيرفرات */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: #8b5cf6;
            font-size: 1rem;
        }

        .create-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.25);
        }

        /* شبكة السيرفرات */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .server-card {
            background: rgba(15, 15, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-3px);
            background: rgba(20, 20, 28, 0.9);
        }

        .server-icon {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #8b5cf6;
        }

        .server-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .server-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.7rem;
            color: #9ca3af;
        }

        .server-port {
            background: rgba(139, 92, 246, 0.12);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
        }

        .server-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            width: fit-content;
        }

        .status-online {
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
        }

        .status-offline {
            background: rgba(107, 114, 128, 0.15);
            color: #9ca3af;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .dot-online {
            background: #4ade80;
            box-shadow: 0 0 4px #4ade80;
        }

        .dot-offline {
            background: #6b7280;
        }

        /* تفاصيل السيرفر */
        .server-detail {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .server-detail.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .server-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* تبويبات */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px 4px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            color: #9ca3af;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .tab-btn.active {
            color: #c084fc;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -9px;
            right: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            border-radius: 2px;
        }

        /* الكونسول */
        .console-box {
            background: #030308;
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 20px;
            padding: 18px;
            height: 320px;
            overflow-y: auto;
            font-family: 'Menlo', 'Courier New', monospace;
            font-size: 0.7rem;
            line-height: 1.5;
            color: #b0f0b0;
            white-space: pre-wrap;
            margin-bottom: 24px;
        }

        .console-box::-webkit-scrollbar {
            width: 4px;
        }
        .console-box::-webkit-scrollbar-track {
            background: #1e1e2a;
            border-radius: 4px;
        }
        .console-box::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 4px;
        }

        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .info-chip {
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
        }

        .info-chip span:first-child {
            color: #9ca3af;
        }

        .info-chip span:last-child {
            font-weight: 600;
            color: #e2e8f0;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0 28px;
        }

        .action-btn {
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            font-family: 'Tajawal', sans-serif;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-start {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .btn-start:hover { background: rgba(34, 197, 94, 0.3); transform: translateY(-1px); }

        .btn-stop {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }
        .btn-stop:hover { background: rgba(239, 68, 68, 0.25); }

        .btn-restart {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        /* جدول الملفات */
        .files-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        .files-table th {
            text-align: right;
            padding: 12px 8px;
            color: #9ca3af;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .files-table td {
            padding: 12px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .file-checkbox {
            width: 16px;
            height: 16px;
            accent-color: #8b5cf6;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .file-btn {
            background: transparent;
            border: none;
            font-size: 0.7rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 20px;
            transition: 0.2s;
            font-family: 'Tajawal', sans-serif;
        }

        .file-edit {
            color: #a78bfa;
            background: rgba(139, 92, 246, 0.1);
        }
        .file-delete {
            color: #f87171;
            background: rgba(239, 68, 68, 0.08);
        }

        .upload-zone {
            border: 1px dashed rgba(139, 92, 246, 0.4);
            background: rgba(139, 92, 246, 0.02);
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            margin-bottom: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-zone:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.05);
        }

        /* مودال */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #12121a;
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 32px;
            width: 90%;
            max-width: 560px;
            padding: 28px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.2rem;
            cursor: pointer;
        }

        textarea, input {
            background: #0c0c12;
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 12px 16px;
            color: #e2e8f0;
            font-family: 'Tajawal', monospace;
            font-size: 0.75rem;
            width: 100%;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e2a;
            border: 1px solid #8b5cf6;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.75rem;
            z-index: 1100;
            display: none;
            backdrop-filter: blur(12px);
        }

        @media (max-width: 720px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .container { padding: 20px 16px; }
            .stat-value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <div class="navbar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-bolt"></i></div>
            <span class="logo-text">DARK PRO HOST</span>
        </div>
        <div class="user-section">
            <div class="user-greeting"><i class="far fa-user-circle"></i> مرحباً، <strong id="username">...</strong></div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
    </div>

    <div class="container" id="appContainer">
        <div id="homeView">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-server"></i></div></div><div class="stat-value" id="usedServers">0/0</div><div class="stat-label">السيرفرات المستخدمة</div></div>
                <div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-calendar-alt"></i></div></div><div class="stat-value" id="expiryDays">--</div><div class="stat-label">المتبقي من الصلاحية</div></div>
                <div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-microchip"></i></div></div><div class="stat-value" id="cpuMetric">0%</div><div class="stat-label">استخدام المعالج</div></div>
                <div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-memory"></i></div></div><div class="stat-value" id="ramMetric">0%</div><div class="stat-label">الذاكرة</div></div>
            </div>

            <div class="section-header">
                <div class="section-title"><i class="fas fa-cubes"></i> السيرفرات النشطة</div>
                <button class="create-btn" onclick="createNewServer()"><i class="fas fa-plus"></i> سيرفر جديد</button>
            </div>
            <div class="servers-grid" id="serversGrid"><div style="text-align:center; padding:40px;">جاري التحميل...</div></div>
        </div>

        <div id="detailView" class="server-detail">
            <div class="detail-header">
                <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-right"></i> العودة</button>
                <div class="server-title" id="detailTitle"></div>
            </div>
            <div class="tabs"><button class="tab-btn active" onclick="switchTab('console')">الكونسول</button><button class="tab-btn" onclick="switchTab('files')">الملفات</button></div>
            <div id="consoleTab"><div class="console-box" id="consoleOut"></div><div class="info-row" id="statusRow"></div><div class="action-buttons"><button class="action-btn btn-start" onclick="serverAction('start')"><i class="fas fa-play"></i> تشغيل</button><button class="action-btn btn-restart" onclick="serverAction('restart')"><i class="fas fa-sync-alt"></i> إعادة تشغيل</button><button class="action-btn btn-stop" onclick="serverAction('stop')"><i class="fas fa-stop"></i> إيقاف</button><button class="action-btn btn-delete" onclick="confirmDelete()"><i class="fas fa-trash"></i> حذف</button></div></div>
            <div id="filesTab" style="display:none;"><div class="upload-zone" onclick="document.getElementById('fileUpload').click()" ondragover="event.preventDefault()" ondrop="handleDrop(event)"><i class="fas fa-cloud-upload-alt"></i> اسحب الملفات أو انقر للرفع</div><input type="file" id="fileUpload" multiple style="display:none" onchange="uploadFiles(this.files)"><div class="action-buttons" style="margin-top:8px"><button class="action-btn btn-start" style="background:#2d2d3a" onclick="installPackages()"><i class="fas fa-cube"></i> تثبيت المكتبات</button><button class="action-btn btn-start" style="background:#2d2d3a" onclick="showCreateFileModal()"><i class="fas fa-file"></i> ملف جديد</button></div><table class="files-table"><thead><tr><th style="width:30px"></th><th>الاسم</th><th>الحجم</th><th></th></tr></thead><tbody id="filesList"></tbody></table></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <div id="editorModal" class="modal"><div class="modal-content"><div class="modal-header"><span class="modal-title" id="editorFileName"></span><button class="modal-close" onclick="closeEditor()">✕</button></div><textarea id="editorArea" rows="12"></textarea><div style="margin-top:16px"><button class="create-btn" style="width:100%" onclick="saveFile()">حفظ التغييرات</button></div></div></div>
    <div id="confirmModal" class="modal"><div class="modal-content" style="max-width:340px"><div class="modal-header"><span class="modal-title">تأكيد</span></div><p id="confirmMsg" style="margin:16px 0">هل أنت متأكد؟</p><div style="display:flex; gap:12px"><button class="create-btn" style="background:#ef4444" id="confirmYesBtn">تأكيد</button><button class="logout-btn" onclick="closeConfirm()">إلغاء</button></div></div></div>
    <div id="createFileModal" class="modal"><div class="modal-content"><div class="modal-header"><span class="modal-title">ملف جديد</span><button class="modal-close" onclick="closeCreateFileModal()">✕</button></div><input type="text" id="newFileName" placeholder="الاسم (مثال: main.py)" style="margin-bottom:12px"><textarea id="newFileContent" rows="4" placeholder="المحتوى (اختياري)"></textarea><div style="margin-top:16px"><button class="create-btn" style="width:100%" onclick="createFile()">إنشاء</button></div></div></div>

    <script>
        let currentServer = null;
        let polling = null;
        let currentFile = null;
        let confirmAction = null;

        const showToast = (msg, type='info') => { const t = document.getElementById('toast'); t.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':'fa-info-circle'}"></i> ${msg}`; t.style.display='block'; setTimeout(()=>t.style.display='none', 3000); };
        const showConfirm = (msg, callback) => { document.getElementById('confirmMsg').innerText = msg; confirmAction = callback; document.getElementById('confirmModal').classList.add('active'); };
        const closeConfirm = () => { document.getElementById('confirmModal').classList.remove('active'); confirmAction=null; };
        const executeConfirm = () => { if(confirmAction) confirmAction(); closeConfirm(); };
        document.getElementById('confirmYesBtn').onclick = executeConfirm;

        async function checkAuth(){ try{ const r=await fetch('/api/current_user'); const d=await r.json(); if(!d.success) window.location.href='/login'; else document.getElementById('username').innerText=d.username; loadServers(); fetchMetrics(); setInterval(fetchMetrics,8000); }catch(e){ window.location.href='/login'; } }
        async function fetchMetrics(){ try{ const r=await fetch('/api/system/metrics'); const d=await r.json(); document.getElementById('cpuMetric').innerText=d.cpu+'%'; document.getElementById('ramMetric').innerText=d.memory+'%'; }catch(e){} }
        async function loadServers(){ const r=await fetch('/api/servers'); const d=await r.json(); if(!d.success) return; const used=d.stats.used, total=d.stats.total; document.getElementById('usedServers').innerText=`${used}/${total}`; document.getElementById('expiryDays').innerText=d.stats.expiry; const grid=document.getElementById('serversGrid'); if(d.servers.length===0){ grid.innerHTML='<div style="text-align:center;padding:40px;color:#9ca3af">لا توجد سيرفرات، أنشئ واحداً</div>'; return; } grid.innerHTML=''; d.servers.forEach(s=>{ const card=document.createElement('div'); card.className='server-card'; card.innerHTML=`<div class="server-icon"><i class="fas fa-cube"></i></div><div class="server-name">${escapeHtml(s.title)}</div><div class="server-meta"><span class="server-port"><i class="fas fa-plug"></i> ${s.port||'N/A'}</span><span class="server-status ${s.status==='Running'?'status-online':'status-offline'}"><span class="status-dot ${s.status==='Running'?'dot-online':'dot-offline'}"></span>${s.status==='Running'?'يعمل':'متوقف'}</span></div>`; card.onclick=()=>openServer(s); grid.appendChild(card); }); }
        function openServer(s){ currentServer=s; document.getElementById('homeView').style.display='none'; document.getElementById('detailView').classList.add('active'); document.getElementById('detailTitle').innerHTML=`<i class="fas fa-server"></i> ${escapeHtml(s.title)}`; switchTab('console'); if(polling) clearInterval(polling); fetchStats(); polling=setInterval(fetchStats,4000); }
        async function fetchStats(){ if(!currentServer) return; try{ const r=await fetch(`/api/server/stats/${currentServer.folder}`); const d=await r.json(); if(!d.success) return; document.getElementById('consoleOut').innerText=d.logs||'لا توجد مخرجات'; document.getElementById('consoleOut').scrollTop=document.getElementById('consoleOut').scrollHeight; const statusDiv=document.getElementById('statusRow'); statusDiv.innerHTML=`<div class="info-chip"><span>الحالة</span><span>${d.status==='Running'?'🟢 يعمل':'⚫ متوقف'}</span></div><div class="info-chip"><span>الذاكرة</span><span>${d.mem||'0 MB'}</span></div><div class="info-chip"><span>وقت التشغيل</span><span>${d.uptime||'0'}</span></div><div class="info-chip"><span>المنفذ</span><span>${d.port||'N/A'}</span></div>`; }catch(e){} }
        async function serverAction(act){ if(act==='delete'){ confirmDelete(); return; } showToast(`جاري ${act==='start'?'التشغيل':act==='stop'?'الإيقاف':'إعادة التشغيل'}...`); const r=await fetch(`/api/server/action/${currentServer.folder}/${act}`,{method:'POST'}); const d=await r.json(); if(d.success){ showToast(d.message,'success'); if(act!=='stop') setTimeout(fetchStats,1000); } else showToast(d.message||'فشل','error'); }
        function confirmDelete(){ showConfirm('⚠️ حذف السيرفر نهائياً؟ لا يمكن التراجع',async()=>{ const r=await fetch(`/api/server/action/${currentServer.folder}/delete`,{method:'POST'}); const d=await r.json(); if(d.success){ showToast('تم الحذف','success'); if(polling) clearInterval(polling); goHome(); }else showToast(d.message||'فشل','error'); }); }
        function goHome(){ document.getElementById('homeView').style.display='block'; document.getElementById('detailView').classList.remove('active'); if(polling) clearInterval(polling); currentServer=null; loadServers(); }
        function switchTab(t){ const con=document.getElementById('consoleTab'), fil=document.getElementById('filesTab'); const btns=document.querySelectorAll('.tab-btn'); if(t==='console'){ con.style.display='block'; fil.style.display='none'; btns[0].classList.add('active'); btns[1].classList.remove('active'); }else{ con.style.display='none'; fil.style.display='block'; btns[0].classList.remove('active'); btns[1].classList.add('active'); loadFiles(); } }
        async function loadFiles(){ const tbody=document.getElementById('filesList'); tbody.innerHTML='<tr><td colspan="4" style="text-align:center">جاري...</td></tr>'; const r=await fetch(`/api/files/list/${currentServer.folder}`); const files=await r.json(); if(files.length===0){ tbody.innerHTML='<tr><td colspan="4" style="text-align:center;color:#9ca3af">لا توجد ملفات</td></tr>'; return; } tbody.innerHTML=files.map(f=>`<tr><td><input type="checkbox" class="file-checkbox" value="${escapeHtml(f.name)}"></td><td><i class="fas ${f.is_dir?'fa-folder':'fa-file'}"></i> ${escapeHtml(f.name)}</td><td>${f.size}</td><td class="file-actions">${!f.is_dir?`<button class="file-btn file-edit" onclick="editFile('${escapeHtml(f.name)}')"><i class="fas fa-edit"></i> تعديل</button>`:''}<button class="file-btn file-delete" onclick="deleteFile('${escapeHtml(f.name)}')"><i class="fas fa-trash"></i> حذف</button></td></tr>`).join(''); }
        async function editFile(name){ currentFile=name; const r=await fetch(`/api/files/content/${currentServer.folder}/${name}`); const d=await r.json(); document.getElementById('editorFileName').innerText=name; document.getElementById('editorArea').value=d.content||''; document.getElementById('editorModal').classList.add('active'); }
        async function saveFile(){ if(!currentFile) return; const content=document.getElementById('editorArea').value; const r=await fetch(`/api/files/save/${currentServer.folder}/${currentFile}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})}); const d=await r.json(); if(d.success){ showToast('تم الحفظ','success'); closeEditor(); loadFiles(); }else showToast('فشل الحفظ','error'); }
        function closeEditor(){ document.getElementById('editorModal').classList.remove('active'); currentFile=null; }
        async function deleteFile(name){ showConfirm(`حذف ${name}؟`,async()=>{ const r=await fetch(`/api/files/delete/${currentServer.folder}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({names:[name]})}); const d=await r.json(); if(d.success){ showToast('تم الحذف','success'); loadFiles(); }else showToast(d.message||'فشل','error'); }); }
        async function uploadFiles(files){ if(!files.length) return; const fd=new FormData(); for(let f of files) fd.append('files[]',f); const r=await fetch(`/api/files/upload/${currentServer.folder}`,{method:'POST',body:fd}); const d=await r.json(); if(d.success){ showToast(d.message,'success'); loadFiles(); }else showToast('فشل الرفع','error'); document.getElementById('fileUpload').value=''; }
        function handleDrop(e){ e.preventDefault(); uploadFiles(e.dataTransfer.files); }
        async function installPackages(){ showToast('بدء تثبيت المكتبات...'); const r=await fetch(`/api/server/install/${currentServer.folder}`,{method:'POST'}); const d=await r.json(); showToast(d.message,d.success?'success':'error'); }
        function showCreateFileModal(){ document.getElementById('newFileName').value=''; document.getElementById('newFileContent').value=''; document.getElementById('createFileModal').classList.add('active'); }
        function closeCreateFileModal(){ document.getElementById('createFileModal').classList.remove('active'); }
        async function createFile(){ const name=document.getElementById('newFileName').value.trim(); const content=document.getElementById('newFileContent').value; if(!name){ showToast('أدخل اسم الملف','error'); return; } const r=await fetch(`/api/files/create/${currentServer.folder}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:name,content})}); const d=await r.json(); if(d.success){ showToast(d.message,'success'); closeCreateFileModal(); loadFiles(); }else showToast(d.message||'فشل','error'); }
        async function createNewServer(){ const name=prompt('اسم السيرفر الجديد:'); if(!name) return; showToast('جاري الإنشاء...'); const r=await fetch('/api/server/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); const d=await r.json(); if(d.success){ showToast(d.message,'success'); loadServers(); }else showToast(d.message||'فشل','error'); }
        async function logout(){ showConfirm('تسجيل الخروج؟',async()=>{ await fetch('/api/logout',{method:'POST'}); sessionStorage.clear(); localStorage.clear(); window.location.href='/login'; }); }
        function escapeHtml(s){ return String(s).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
        checkAuth();
    </script>
</body>
</html>
