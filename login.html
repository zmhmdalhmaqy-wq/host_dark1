<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول | DARK BRO HOST</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0c12;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ========== خلفية متحركة احترافية ========== */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #0f0f1f, #05070c);
            z-index: -2;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .glow-orb {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.12), transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            z-index: -1;
            animation: floatGlow 20s infinite ease-in-out;
        }

        .glow-orb-2 {
            bottom: -200px;
            left: -200px;
            top: auto;
            right: auto;
            background: radial-gradient(circle, rgba(255, 100, 100, 0.08), transparent 70%);
            animation: floatGlow 25s infinite reverse;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(40px, -30px) scale(1.1); opacity: 0.6; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1); }
        }

        /* ========== بطاقة تسجيل الدخول ========== */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            margin: 20px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: rgba(12, 16, 28, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 32px;
            padding: 48px 40px;
            transition: all 0.4s ease;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .login-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 30px 60px rgba(0, 212, 255, 0.1);
        }

        /* ========== الشعار ========== */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 34px;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
            animation: glowPulse 2s infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3); }
            50% { box-shadow: 0 15px 40px rgba(0, 212, 255, 0.6); }
        }

        .logo-name {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-badge {
            display: inline-block;
            background: rgba(0, 212, 255, 0.15);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: 600;
            color: #00d4ff;
            margin-top: 8px;
        }

        .logo-sub {
            font-size: 12px;
            color: #8899aa;
            margin-top: 12px;
        }

        /* ========== الحقول ========== */
        .form-group {
            margin-bottom: 22px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            right: 16px;
            color: #00d4ff;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s;
        }

        .form-group input {
            width: 100%;
            padding: 14px 45px 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(0, 212, 255, 0.2);
            border-radius: 28px;
            color: #fff;
            font-size: 14px;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #556677;
            font-size: 13px;
        }

        /* ========== خيار تذكرني ========== */
        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
            font-size: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #8899aa;
        }

        .checkbox-label input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #00d4ff;
        }

        /* ========== زر الدخول ========== */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border: none;
            border-radius: 40px;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* ========== رابط إنشاء حساب ========== */
        .register-link {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
        }

        .register-link a {
            color: #00d4ff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .register-link a:hover {
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
        }

        /* ========== نموذج إنشاء حساب ========== */
        #registerForm {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-title {
            color: #00d4ff;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-register {
            background: linear-gradient(135deg, #00ff88, #00aa55);
            margin-bottom: 10px;
        }

        .btn-register:hover {
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.3);
        }

        .btn-cancel {
            background: rgba(255, 68, 68, 0.2);
            color: #ff8888;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        .btn-cancel:hover {
            background: rgba(255, 68, 68, 0.3);
            box-shadow: 0 10px 25px rgba(255, 68, 68, 0.2);
        }

        /* ========== رسائل الخطأ ========== */
        .error-msg {
            display: none;
            background: rgba(255, 68, 68, 0.12);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff8888;
            padding: 12px 16px;
            border-radius: 28px;
            margin-bottom: 20px;
            font-size: 12px;
            text-align: center;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success-msg {
            background: rgba(0, 255, 136, 0.12);
            border-color: rgba(0, 255, 136, 0.3);
            color: #88ff88;
        }

        /* ========== تذييل ========== */
        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 11px;
            color: #556677;
        }

        .footer a {
            color: #00d4ff;
            text-decoration: none;
        }

        /* ========== شاشة التحميل ========== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 18, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00d4ff;
            font-size: 14px;
        }

        /* ========== استجابة للجوال ========== */
        @media (max-width: 550px) {
            .login-card {
                padding: 35px 25px;
            }
            .logo-name {
                font-size: 24px;
            }
            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
            .form-group input {
                padding: 12px 40px 12px 15px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grid-overlay"></div>
    <div class="glow-orb"></div>
    <div class="glow-orb-2"></div>
    <div class="stars" id="stars"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-skull"></i>
                </div>
                <div class="logo-name">DARK BRO HOST</div>
                <div class="logo-badge">PROFESSIONAL HOSTING</div>
                <div class="logo-sub">استضافة احترافية | تشغيل مستمر 24/7</div>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm">
                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password" required>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe"> تذكرني
                    </label>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> دخول
                </button>
            </form>

            <div class="register-link">
                <a onclick="showRegister()">
                    <i class="fas fa-user-plus"></i> إنشاء حساب جديد
                </a>
            </div>

            <!-- نموذج إنشاء حساب -->
            <div id="registerForm" style="display: none;">
                <div class="register-title">
                    <i class="fas fa-sparkles"></i> إنشاء حساب جديد
                </div>
                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="regUsername" placeholder="اسم المستخدم">
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="regPassword" placeholder="كلمة المرور">
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-check-circle input-icon"></i>
                        <input type="password" id="regConfirmPassword" placeholder="تأكيد كلمة المرور">
                    </div>
                </div>
                <button class="btn-login btn-register" onclick="registerUser()">
                    <i class="fas fa-check"></i> إنشاء الحساب
                </button>
                <button class="btn-login btn-cancel" onclick="hideRegister()">
                    <i class="fas fa-times"></i> إلغاء
                </button>
            </div>

            <div class="footer">
                <span>© 2026 DARK BRO HOST</span> • 
                <span>استضافة سريعة وآمنة</span> • 
                <span>v3.0</span>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">جاري المعالجة...</div>
    </div>

    <audio id="clickSound" preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/button-click-01.mp3" type="audio/mpeg">
    </audio>
    <audio id="successSound" preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ========== إنشاء النجوم ==========
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 120;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                star.style.animationDuration = `${Math.random() * 2 + 2}s`;
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // ========== الأصوات ==========
        function playSound(type = 'click') {
            try {
                const sound = document.getElementById(type === 'click' ? 'clickSound' : 'successSound');
                if (sound) {
                    sound.volume = 0.2;
                    sound.play().catch(e => console.log('Sound disabled'));
                }
            } catch(e) {}
        }

        // ========== عرض رسالة ==========
        function showMessage(msg, isError = true) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = msg;
            errorMsg.className = 'error-msg ' + (isError ? '' : 'success-msg');
            errorMsg.style.display = 'block';
            playSound(isError ? 'click' : 'success');
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 4000);
        }

        // ========== إظهار/إخفاء التحميل ==========
        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = show ? 'flex' : 'none';
        }

        // ========== تسجيل الدخول ==========
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!username || !password) {
                showMessage('⚠️ الرجاء إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            showLoading(true);

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, remember_me: rememberMe})
                });
                const data = await res.json();
                
                if (data.success) {
                    showMessage('✅ تم تسجيل الدخول بنجاح، جاري التحويل...', false);
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    showMessage('❌ ' + data.message);
                }
            } catch (err) {
                showMessage('❌ خطأ في الاتصال بالخادم');
            } finally {
                showLoading(false);
            }
        };

        // ========== إظهار نموذج التسجيل ==========
        function showRegister() {
            document.getElementById('registerForm').style.display = 'block';
            playSound('click');
        }

        function hideRegister() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regConfirmPassword').value = '';
            playSound('click');
        }

        // ========== إنشاء حساب جديد ==========
        async function registerUser() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            
            if (!username || !password) {
                showMessage('⚠️ الرجاء إدخال جميع البيانات');
                return;
            }
            
            if (password !== confirm) {
                showMessage('⚠️ كلمة المرور غير متطابقة');
                return;
            }
            
            if (password.length < 4) {
                showMessage('⚠️ كلمة المرور يجب أن تكون 4 أحرف على الأقل');
                return;
            }

            showLoading(true);

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                
                if (data.success) {
                    showMessage('✅ ' + data.message + ' | يمكنك الآن تسجيل الدخول', false);
                    hideRegister();
                    document.getElementById('username').value = username;
                    document.getElementById('password').focus();
                } else {
                    showMessage('❌ ' + data.message);
                }
            } catch(err) {
                showMessage('❌ خطأ في الاتصال بالخادم');
            } finally {
                showLoading(false);
            }
        }

        // ========== التحقق من وجود جلسة نشطة ==========
        async function checkExistingSession() {
            try {
                const res = await fetch('/api/current_user');
                const data = await res.json();
                if (data.success && data.username) {
                    window.location.href = data.is_admin ? '/admin' : '/dashboard';
                }
            } catch(e) {}
        }
        checkExistingSession();

        // ========== اختصار Enter ==========
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('registerForm').style.display === 'block') {
                    registerUser();
                }
            }
        });
    </script>
</body>
</html>
